<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Capturas e-Karú</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#EEF4F2;--fg:#0F2F2B;--card:#FFFFFF;--line:#C9DAD6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#071F1C;--fg:#E8F6F3;--card:#0D2F2B;--line:#1E5C54;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071F1C;--fg:#E8F6F3;--card:#0D2F2B;--line:#1E5C54;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:flex;flex-direction:column;gap:16px;align-items:center}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:92vh;justify-content:center}
figure img{height:84vh;width:auto;max-width:100%;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--card)}
figcaption{font-size:13px}
</style>
<main>
<figure id="i1"><img src="ekaru_cono2_sabores.jpg" alt="Cono 2: grupo y sabores"><figcaption>Cono 2 · grupo y sabores</figcaption></figure>
<figure id="i2"><img src="ekaru_cono2_baldes.jpg" alt="Cono 2: baldes"><figcaption>Cono 2 · un balde por sabor</figcaption></figure>
<figure id="i3"><img src="ekaru_brownie_con_helado.jpg" alt="Brownie con helado"><figcaption>Brownie con helado</figcaption></figure>
<figure id="i4"><img src="ekaru_brownie_porcion.jpg" alt="Brownie porción en la caja"><figcaption>Brownie porción en la caja</figcaption></figure>

</body></html>
