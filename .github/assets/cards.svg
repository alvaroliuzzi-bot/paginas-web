<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250"><style>.float{animation:f 6s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.dash{animation:d 3s linear infinite}@keyframes d{to{stroke-dashoffset:-36}}.twinkle{animation:t 2.4s ease-in-out infinite}@keyframes t{0%,100%{opacity:1}50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.float,.dash,.twinkle{animation:none}}</style><g class="float" style="animation-delay:0.0s"><rect x="2" y="10" width="411" height="230" rx="22" fill="#fff" stroke="#4F46E5" stroke-opacity=".35" stroke-width="2"/><rect x="2" y="10" width="411" height="10" rx="5" fill="#4F46E5"/><circle cx="54" cy="70" r="28" fill="#4F46E5"/><text x="54" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">V</text><text x="96" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">e-Karú Ventas</text><text x="30" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">Vender con un solo código por grupo:</text><text x="30" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">sabores y descuento por balde</text></g><g class="float" style="animation-delay:0.4s"><rect x="435" y="10" width="411" height="230" rx="22" fill="#fff" stroke="#F2A541" stroke-opacity=".35" stroke-width="2"/><rect x="435" y="10" width="411" height="10" rx="5" fill="#F2A541"/><circle cx="487" cy="70" r="28" fill="#F2A541"/><text x="487" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">C</text><text x="529" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">Capturas</text><text x="463" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">Las cuatro pantallas usadas en la</text><text x="463" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">encuesta al personal de caja</text></g><g class="float" style="animation-delay:0.8s"><rect x="867" y="10" width="411" height="230" rx="22" fill="#fff" stroke="#E0457B" stroke-opacity=".35" stroke-width="2"/><rect x="867" y="10" width="411" height="10" rx="5" fill="#E0457B"/><circle cx="919" cy="70" r="28" fill="#E0457B"/><text x="919" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">D</text><text x="961" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">Documentos</text><text x="895" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">Informes editables en Claude que se</text><text x="895" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">exportan a Word o PDF</text></g></svg>